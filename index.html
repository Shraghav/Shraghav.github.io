  <style>
    :root {
      --background: #15171c;
      --foreground: #f1f0e9;
      --card: #1d2026;
      --primary: #b8ee72;
      --primary-foreground: #1b1e1a;
      --secondary: #292d34;
      --secondary-foreground: #e8e7e0;
      --muted: #24282e;
      --muted-foreground: #a3a7ae;
      --accent: #e4bd78;
      --border: rgba(255, 255, 255, 0.10);
      --font-sans: "Geist", ui-sans-serif, system-ui, sans-serif;
      --font-display: "Instrument Serif", Georgia, serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background-color: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0);
      background-size: 28px 28px;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    ::selection { background: var(--primary); color: var(--primary-foreground); }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; }
    .container, .header-inner { width: min(1152px, calc(100% - 48px)); margin-inline: auto; }
    .site-header { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--border); background: rgba(21,23,28,.86); backdrop-filter: blur(14px); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; padding-block: 16px; }
    .logo { font-family: var(--font-mono); font-size: 14px; }
    .logo span { color: var(--primary); }
    nav { display: flex; gap: 28px; font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); }
    nav a, .contact-links a { transition: color .2s; }
    nav a:hover, .contact-links a:hover { color: var(--primary); }
    .button { display: inline-flex; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: 999px; background: var(--primary); color: var(--primary-foreground); font-weight: 500; transition: opacity .2s, border-color .2s, transform .2s; }
    .button:hover { opacity: .9; }
    .button-small { padding: 7px 16px; font-size: 12px; }
    .button-large { padding: 12px 24px; font-size: 14px; }
    .button-outline { border-color: var(--border); background: transparent; color: var(--foreground); }
    .button-outline:hover { border-color: var(--primary); opacity: 1; }
    .hero { padding-block: 112px; }
    .availability { display: inline-flex; align-items: center; gap: 9px; border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; margin-bottom: 24px; color: var(--muted-foreground); font-family: var(--font-mono); font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 5px rgba(184,238,114,.10); }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 0; font-family: var(--font-display); font-size: clamp(56px, 8vw, 96px); font-weight: 400; line-height: 1.02; letter-spacing: -.025em; }
    .intro { max-width: 720px; margin: 26px 0 0; color: var(--muted-foreground); font-size: 18px; line-height: 1.65; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 40px; }
    .section { padding-block: 64px; scroll-margin-top: 80px; }
    .section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 40px; }
    .kicker, .meta { color: var(--muted-foreground); font-family: var(--font-mono); font-size: 12px; }
    .meta { font-size: 14px; white-space: nowrap; }
    .section-heading h2, .contact h2 { margin: 8px 0 0; font-family: var(--font-display); font-size: clamp(38px, 5vw, 52px); font-weight: 400; line-height: 1.1; }
    .experience-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .card { border: 1px solid var(--border); border-radius: 14px; background: var(--card); transition: transform .3s, border-color .3s; }
    .experience-card { display: flex; flex-direction: column; padding: 28px; }
    .experience-card:hover, .skill-card:hover { transform: translateY(-3px); border-color: rgba(184,238,114,.45); }
    .client { color: var(--accent); font-family: var(--font-mono); font-size: 12px; }
    .experience-card h3 { margin: 16px 0 0; font-family: var(--font-display); font-size: 32px; font-weight: 400; line-height: 1.1; }
    .summary { margin: 14px 0 0; color: var(--muted-foreground); font-size: 14px; line-height: 1.65; }
    .problem { margin-top: 20px; padding: 16px; border-left: 2px solid var(--primary); border-radius: 6px; background: var(--muted); font-size: 14px; }
    .problem span { color: var(--primary); font-family: var(--font-mono); font-size: 12px; }
    .details-button { align-self: flex-start; margin-top: 20px; padding: 0; border: 0; background: transparent; color: var(--primary); cursor: pointer; font-family: var(--font-mono); font-size: 12px; }
    .details-button:hover, .project-link:hover { text-decoration: underline; }
    .detail-list { display: grid; gap: 12px; margin: 18px 0 0; padding: 0; list-style: none; font-size: 14px; line-height: 1.6; }
    .detail-list li { display: flex; gap: 12px; }
    .detail-list li > span { color: var(--primary); flex: none; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .stack { margin-top: auto; padding-top: 24px; }
    .chip { display: inline-block; padding: 3px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--secondary); color: var(--secondary-foreground); font-family: var(--font-mono); font-size: 11px; }
    .project-card { display: grid; grid-template-columns: 3fr 2fr; gap: 32px; padding: 32px; box-shadow: 0 20px 60px -30px rgba(184,238,114,.45); }
    .project-points { margin-top: 24px; }
    .project-link { display: inline-block; margin-top: 30px; color: var(--primary); font-family: var(--font-mono); font-size: 13px; }
    .architecture { padding: 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--background); font-family: var(--font-mono); font-size: 12px; line-height: 1.8; }
    .step-number { color: var(--accent); }
    .arrow { padding-left: 20px; color: var(--muted-foreground); }
    .architecture-chips { margin-top: 18px; }
    .skills-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .skill-card { padding: 24px; }
    .skill-title { margin-bottom: 16px; color: var(--primary); font-family: var(--font-mono); font-size: 12px; }
    .education-list { overflow: hidden; }
    .education-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px; }
    .education-row + .education-row { border-top: 1px solid var(--border); }
    .degree { font-weight: 500; }
    .school { margin-top: 4px; color: var(--muted-foreground); font-size: 14px; }
    .grades { display: flex; gap: 24px; white-space: nowrap; font-family: var(--font-mono); font-size: 13px; }
    .grades span:first-child { color: var(--primary); }
    .grades span:last-child { color: var(--muted-foreground); }
    .contact { padding-block: 96px; text-align: center; scroll-margin-top: 80px; }
    .contact h2 { font-size: clamp(48px, 7vw, 72px); }
    .contact p { max-width: 520px; margin: 24px auto 0; color: var(--muted-foreground); }
    .contact-email { margin-top: 38px; padding: 15px 30px; }
    .contact-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; margin-top: 32px; color: var(--muted-foreground); font-family: var(--font-mono); font-size: 13px; }
    footer { padding-block: 24px; border-top: 1px solid var(--border); color: var(--muted-foreground); text-align: center; font-family: var(--font-mono); font-size: 12px; }
    .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .rise { animation: none; } .card, .button { transition: none; } }
    @media (max-width: 850px) {
      nav { display: none; }
      .hero { padding-block: 80px; }
      .experience-grid, .project-card { grid-template-columns: 1fr; }
      .skills-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .container, .header-inner { width: min(100% - 32px, 1152px); }
      .hero { padding-block: 64px; }
      .intro { font-size: 16px; }
      .section { padding-block: 48px; }
      .section-heading, .education-row { align-items: flex-start; flex-direction: column; }
      .meta { white-space: normal; }
      .experience-card, .project-card { padding: 22px; }
      .skills-grid { grid-template-columns: 1fr; }
      .grades { width: 100%; justify-content: space-between; }
      .contact { padding-block: 72px; }
      .contact-email { max-width: 100%; font-size: 13px; }
    }
  </style>
</head>
